<title>The Axis That Lies - Lesson 5.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#E9EDF1;
  --ink:#14171C; --ink-2:#4B535E; --ink-3:#818A96;
  --line:#D5DAE1; --grid:#E4E8ED;
  --bar:#2C5F9E; --bar-top:#3B76BC;
  --alert:#A8452F; --alert-soft:#F7EAE6;
  --ok:#3E7458;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --surface:#161A20; --surface-2:#1F252D;
    --ink:#E6E9EE; --ink-2:#A5ADB9; --ink-3:#79828F;
    --line:#2A313A; --grid:#232A33;
    --bar:#4E88CC; --bar-top:#6BA2E0;
    --alert:#E28671; --alert-soft:#2E1F1B;
    --ok:#6FAC8D;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#161A20; --surface-2:#1F252D;
  --ink:#E6E9EE; --ink-2:#A5ADB9; --ink-3:#79828F;
  --line:#2A313A; --grid:#232A33;
  --bar:#4E88CC; --bar-top:#6BA2E0;
  --alert:#E28671; --alert-soft:#2E1F1B;
  --ok:#6FAC8D;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); line-height:1.55; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:28px 20px 40px}

header{margin-bottom:22px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 8px;
}
h1{font-size:clamp(22px,3.6vw,30px); letter-spacing:-.02em; font-weight:670; margin:0; text-wrap:balance}

/* stage */
.stage{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:22px 24px 18px; margin-bottom:16px;
}

/* step 1 - the numbers */
table{border-collapse:collapse; margin:0 auto; font-variant-numeric:tabular-nums}
th,td{padding:7px 22px; text-align:left; border-bottom:1px solid var(--line); font-size:15px}
th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600;
}
td:last-child{font-family:var(--mono); font-weight:620; text-align:right}
tbody tr:last-child td{border-bottom:none}
#numbers{transition:opacity .4s ease}
#chartWrap{display:none}
#chartWrap.on{display:block}

svg{width:100%; height:auto; display:block; overflow:visible}
.gridline{stroke:var(--grid); stroke-width:1}
.axis{stroke:var(--line); stroke-width:1.5}
.tick{font-family:var(--mono); font-size:11px; fill:var(--ink-3); font-variant-numeric:tabular-nums}
.xlabel{font-family:var(--sans); font-size:13px; fill:var(--ink-2)}
.vlabel{font-family:var(--mono); font-size:12px; font-weight:620; fill:var(--ink); font-variant-numeric:tabular-nums}
.bar{fill:var(--bar)}
.axisbadge{
  font-family:var(--mono); font-size:11.5px; font-weight:640; letter-spacing:.02em;
  fill:var(--alert);
}

/* caption */
.caption{
  min-height:3.4em; margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line);
  font-size:15.5px; color:var(--ink-2); max-width:62ch;
}
.caption strong{color:var(--ink); font-weight:640}
.caption.reveal{color:var(--ink)}
.caption em{font-style:normal; color:var(--alert); font-weight:600}

/* controls */
.controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
button{
  font-family:var(--sans); font-size:14px; font-weight:580; color:var(--surface);
  background:var(--ink); border:none; border-radius:6px; padding:9px 18px; cursor:pointer;
}
button.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line)}
button:disabled{opacity:.35; cursor:default}
button:focus-visible{outline:2px solid var(--bar); outline-offset:2px}
.hint{
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); margin-left:auto;
}
.dots{display:flex; gap:6px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--line)}
.dot.on{background:var(--ink)}

@media (prefers-reduced-motion:reduce){
  #numbers{transition:none}
}
@media (max-width:520px){
  .stage{padding:16px 14px 12px}
  .hint{display:none}
  th,td{padding:6px 12px}
}
</style>

<div class="wrap">
<header>
  <p class="eyebrow">Lesson 5.1 · Responsible and Ethical Use of Data</p>
  <h1>The same four numbers, told two ways</h1>
</header>

<div class="stage">
  <div id="numbers">
    <table>
      <thead><tr><th>Month</th><th>Repayment rate</th></tr></thead>
      <tbody>
        <tr><td>January</td><td>91.0%</td></tr>
        <tr><td>February</td><td>91.4%</td></tr>
        <tr><td>March</td><td>91.2%</td></tr>
        <tr><td>April</td><td>92.0%</td></tr>
      </tbody>
    </table>
  </div>

  <div id="chartWrap">
    <svg id="chart" viewBox="0 0 720 420" role="img"
         aria-label="Bar chart of monthly repayment rates. The vertical axis range changes from 90–92 percent to 0–100 percent, showing the same four values as either a steep rise or a flat line.">
      <g id="grid"></g>
      <g id="bars"></g>
      <g id="vlabels"></g>
      <g id="ticks"></g>
      <g id="xlabels"></g>
      <line id="yaxis" class="axis"></line>
      <line id="xaxis" class="axis"></line>
      <text id="badge" class="axisbadge" x="58" y="26"></text>
    </svg>
  </div>

  <p class="caption" id="caption">Four months of repayment data from the loan pilot. Nothing here is in dispute.</p>
</div>

<div class="controls">
  <button id="next">Show the chart</button>
  <button id="back" class="ghost" disabled>Back</button>
  <div class="dots" id="dots"></div>
  <span class="hint">Space / → to advance</span>
</div>
</div>

<script>
const DATA = [
  {m:"Jan", v:91.0}, {m:"Feb", v:91.4}, {m:"Mar", v:91.2}, {m:"Apr", v:92.0}
];
const TRUNC = {lo:90, hi:92}, FULL = {lo:0, hi:100};

const PLOT = {left:88, right:690, top:52, bottom:352};
const PW = PLOT.right - PLOT.left, PH = PLOT.bottom - PLOT.top;
const NS = "http://www.w3.org/2000/svg";

const $ = id => document.getElementById(id);
const el = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };

// build static bits
const bars = DATA.map((d, i) => {
  const w = PW / DATA.length * 0.54;
  const x = PLOT.left + (PW / DATA.length) * (i + 0.5) - w / 2;
  const r = el("rect", {class:"bar", x, width:w, rx:2});
  $("bars").appendChild(r);
  const lab = el("text", {class:"vlabel", x:x + w/2, "text-anchor":"middle"});
  lab.textContent = d.v.toFixed(1) + "%";
  $("vlabels").appendChild(lab);
  const xl = el("text", {class:"xlabel", x:x + w/2, y:PLOT.bottom + 24, "text-anchor":"middle"});
  xl.textContent = d.m;
  $("xlabels").appendChild(xl);
  return {rect:r, label:lab, x, w, v:d.v};
});
$("yaxis").setAttribute("x1", PLOT.left); $("yaxis").setAttribute("x2", PLOT.left);
$("yaxis").setAttribute("y1", PLOT.top - 10); $("yaxis").setAttribute("y2", PLOT.bottom);
$("xaxis").setAttribute("x1", PLOT.left); $("xaxis").setAttribute("x2", PLOT.right);
$("xaxis").setAttribute("y1", PLOT.bottom); $("xaxis").setAttribute("y2", PLOT.bottom);

const TICKN = 5;
const gridLines = [], tickLabels = [];
for (let i = 0; i < TICKN; i++){
  const y = PLOT.bottom - (PH / (TICKN - 1)) * i;
  const g = el("line", {class:"gridline", x1:PLOT.left, x2:PLOT.right, y1:y, y2:y});
  $("grid").appendChild(g); gridLines.push(g);
  const t = el("text", {class:"tick", x:PLOT.left - 12, y:y + 4, "text-anchor":"end"});
  $("ticks").appendChild(t); tickLabels.push(t);
}

function render(lo, hi){
  const span = hi - lo;
  bars.forEach(b => {
    const frac = Math.max(0, Math.min(1, (b.v - lo) / span));
    const h = frac * PH;
    b.rect.setAttribute("y", PLOT.bottom - h);
    b.rect.setAttribute("height", Math.max(0, h));
    b.label.setAttribute("y", PLOT.bottom - h - 9);
  });
  tickLabels.forEach((t, i) => {
    const val = lo + (span / (TICKN - 1)) * i;
    t.textContent = span <= 5 ? val.toFixed(1) : Math.round(val);
  });
  const whole = Math.abs(lo - FULL.lo) < 0.01 && Math.abs(hi - FULL.hi) < 0.01;
  $("badge").textContent = `vertical axis: ${span <= 5 ? lo.toFixed(1) : Math.round(lo)}% – ${span <= 5 ? hi.toFixed(1) : Math.round(hi)}%`;
  $("badge").style.fill = whole ? "var(--ok)" : "var(--alert)";
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null;
function morph(from, to, ms){
  if (anim) cancelAnimationFrame(anim);
  if (reduce || ms === 0){ render(to.lo, to.hi); return; }
  const t0 = performance.now();
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
  (function frame(now){
    const p = Math.min(1, (now - t0) / ms), e = ease(p);
    render(from.lo + (to.lo - from.lo)*e, from.hi + (to.hi - from.hi)*e);
    if (p < 1) anim = requestAnimationFrame(frame);
  })(t0);
}

const STEPS = [
  { btn:"Show the chart",
    cap:"Four months of repayment data from the loan pilot. Nothing here is in dispute." },
  { btn:"Is this chart lying?",
    cap:"An analyst who wants the pilot to look successful can draw <strong>this</strong>. April looks like roughly double January." },
  { btn:"Show the takeaway",
    cap:"The same four numbers, with the axis starting at zero. Notice the labels on the bars never changed." },
  { btn:"Restart",
    cap:"<strong>Chart A contains no false numbers.</strong> Nobody edited a value. Somebody <em>chose the axis</em> that told the story they wanted - and that is the most common dishonesty in data work." }
];

let step = 0;
const dots = STEPS.map(() => { const d = document.createElement("span");
  d.className = "dot"; $("dots").appendChild(d); return d; });

function go(n, animate = true){
  step = (n + STEPS.length) % STEPS.length;
  $("chartWrap").classList.toggle("on", step >= 1);
  $("numbers").style.display = step === 0 ? "" : "none";
  if (step === 0)      render(TRUNC.lo, TRUNC.hi);
  else if (step === 1) morph(TRUNC, TRUNC, 0);
  else                 morph(step === 2 && animate ? TRUNC : FULL, FULL, step === 2 && animate ? 1700 : 0);
  $("caption").innerHTML = STEPS[step].cap;
  $("caption").classList.toggle("reveal", step === 3);
  $("next").textContent = STEPS[step].btn;
  $("back").disabled = step === 0;
  dots.forEach((d, i) => d.classList.toggle("on", i <= step));
}

$("next").addEventListener("click", () => go(step + 1));
$("back").addEventListener("click", () => go(step - 1, false));
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowRight"){ e.preventDefault(); go(step + 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); go(step - 1, false); }
});
go(0);
</script>
