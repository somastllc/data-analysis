<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">SQL to Python workflow with two outputs</title>
  <desc id="desc">SQL sends data to Python. Python then sends the results to an Excel report and a Power BI dashboard.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D9DFDF"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="520" rx="24" fill="#F6F8F8"/>
  <rect x="18" y="18" width="884" height="484" rx="20" fill="url(#dots)"/>

  <g id="flow" fill="none" stroke="#1A733A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 228 260 H 304" marker-end="url(#arrow)"/>
    <path d="M 504 260 H 570 V 135 H 644" marker-end="url(#arrow)"/>
    <path d="M 570 260 V 385 H 644" marker-end="url(#arrow)"/>
  </g>
  <circle cx="570" cy="260" r="10" fill="#1A733A"/>

  <g id="nodes" font-family="Geist, Arial, sans-serif" text-anchor="middle">
    <rect x="28" y="205" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
    <text x="128" y="270" fill="#121212" font-size="34" font-weight="650">SQL</text>

    <rect x="304" y="205" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
    <text x="404" y="270" fill="#121212" font-size="34" font-weight="650">Python</text>

    <rect x="644" y="80" width="248" height="110" rx="18" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/>
    <text x="768" y="145" fill="#121212" font-size="31" font-weight="650">Excel report</text>

    <rect x="644" y="330" width="248" height="110" rx="18" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/>
    <text x="768" y="378" fill="#121212" font-size="29" font-weight="650">
      <tspan x="768" dy="0">Power BI</tspan>
      <tspan x="768" dy="35">dashboard</tspan>
    </text>
  </g>
</svg>
