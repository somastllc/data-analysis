      <path d="M 82 466 Q 115 425 148 466" fill="#EDFBF2" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
      <path d="M 244 420 H 296 M 244 444 H 284 M 244 468 H 272" fill="none" stroke="#1A733A" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g id="money-transfer">
      <rect x="382" y="34" width="316" height="452" rx="22" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
      <text x="540" y="92" font-size="32" font-weight="650">Money transfer</text>
      <rect x="454" y="132" width="172" height="294" rx="26" fill="#FFFFFF" stroke="#121212" stroke-width="6"/>
      <path d="M 512 159 H 568" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
      <circle cx="540" cy="398" r="8" fill="#1A733A"/>
      <circle cx="500" cy="228" r="25" fill="#EDFBF2" stroke="#121212" stroke-width="4"/>
      <circle cx="580" cy="330" r="25" fill="#EDFBF2" stroke="#121212" stroke-width="4"/>
      <path d="M 506 276 C 534 258 566 260 584 282" fill="none" stroke="#1A733A" stroke-width="7" stroke-linecap="round"/>
      <path d="M 576 267 L 586 283 L 567 287" fill="none" stroke="#1A733A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 574 282 C 546 300 516 300 497 278" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
      <path d="M 505 294 L 495 277 L 514 273" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="school">
