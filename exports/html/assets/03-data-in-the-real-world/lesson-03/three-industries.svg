<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">A clinic, a money transfer service, and a school</title>
  <desc id="desc">Three simple panels show a clinic building, a phone used for money transfers, and a school building.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D9DFDF"/>
    </pattern>
  </defs>

  <rect width="1080" height="520" rx="26" fill="#F6F8F8"/>
  <rect x="18" y="18" width="1044" height="484" rx="22" fill="url(#dots)"/>

  <g font-family="Geist, Arial, sans-serif" fill="#121212" text-anchor="middle">
    <g id="clinic">
      <rect x="28" y="34" width="316" height="452" rx="22" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
      <text x="186" y="92" font-size="32" font-weight="650">Clinic</text>
