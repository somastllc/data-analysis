      <text x="894" y="92" font-size="32" font-weight="650">School</text>
      <path d="M 788 226 L 894 152 L 1000 226" fill="#EDFBF2" stroke="#121212" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
