<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">Four data sources become one clean table</title><desc id="m-desc">Shop tills, driver logs, supplier PDF invoices, and phone-order notes pass through data engineering into one clean daily table.</desc>
  <defs><pattern id="m-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern><marker id="m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs><rect width="1080" height="500" rx="24" fill="url(#m-dots)"/>
  <g font-family="Geist,Arial,sans-serif" text-anchor="middle"><g transform="translate(38 35)"><rect width="250" height="86" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="125" y="53" font-size="23" font-weight="600" fill="#121212">A till in each shop</text></g><g transform="translate(38 150)"><rect width="250" height="86" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="125" y="53" font-size="23" font-weight="600" fill="#121212">Delivery drivers</text></g><g transform="translate(38 265)"><rect width="250" height="86" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="125" y="53" font-size="23" font-weight="600" fill="#121212">Supplier invoices</text></g><g transform="translate(38 380)"><rect width="250" height="86" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="125" y="53" font-size="23" font-weight="600" fill="#121212">Phone orders</text></g></g>
  <g fill="none" stroke="#1A733A" stroke-width="4" marker-end="url(#m-arrow)"><path d="M288 78 C370 78 364 190 427 210"/><path d="M288 193 C355 193 371 223 427 232"/><path d="M288 308 C355 308 371 277 427 268"/><path d="M288 423 C370 423 364 310 427 290"/></g><g transform="translate(435 150)" font-family="Geist,Arial,sans-serif" text-anchor="middle"><rect width="250" height="200" rx="34" fill="#EDFBF2" stroke="#1A733A" stroke-width="5"/><text x="125" y="72" font-size="31" font-weight="600" fill="#121212">Data engineer</text><text x="125" y="116" font-size="20" fill="#4D5353">pull all four together</text><text x="125" y="150" font-size="20" fill="#4D5353">reconcile the product names</text></g><path d="M685 250 H760" fill="none" stroke="#1A733A" stroke-width="5" marker-end="url(#m-arrow)"/><g transform="translate(778 105)" font-family="Geist,Arial,sans-serif"><rect width="260" height="290" rx="22" fill="#fff" stroke="#121212" stroke-width="4"/><text x="130" y="44" text-anchor="middle" font-size="25" font-weight="600" fill="#121212">one clean table</text><path d="M24 67 H236 M24 116 H236 M24 165 H236 M24 214 H236 M24 263 H236 M92 67 V263 M166 67 V263" stroke="#BFC7C7" stroke-width="3"/><rect x="25" y="68" width="210" height="47" fill="#EDFBF2"/><text x="130" y="284" text-anchor="middle" font-size="20" font-weight="500" fill="#4D5353">every morning</text></g>
</svg>
