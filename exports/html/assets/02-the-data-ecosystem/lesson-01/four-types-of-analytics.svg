<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="a-title a-desc">
  <title id="a-title">Four types of analytics</title><desc id="a-desc">A left-to-right path from descriptive to diagnostic, predictive, and prescriptive analytics.</desc>
  <defs><pattern id="a-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#D7DDDD"/></pattern><marker id="a-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs>
  <rect width="1100" height="430" rx="24" fill="url(#a-dots)"/>
  <path d="M235 211 C274 198 284 224 326 211 M502 211 C541 198 551 224 593 211 M769 211 C808 198 818 224 860 211" fill="none" stroke="#1A733A" stroke-width="5" stroke-linecap="round" marker-end="url(#a-arrow)"/>
  <g font-family="Geist,Arial,sans-serif" text-anchor="middle"><g transform="translate(35 110)"><rect width="200" height="200" rx="22" fill="#fff" stroke="#121212" stroke-width="4"/><text x="100" y="98" font-size="28" font-weight="600" fill="#121212">Descriptive</text><text x="100" y="145" font-size="23" fill="#4D5353">What happened?</text></g><g transform="translate(302 110)"><rect width="200" height="200" rx="22" fill="#fff" stroke="#121212" stroke-width="4"/><text x="100" y="98" font-size="28" font-weight="600" fill="#121212">Diagnostic</text><text x="100" y="145" font-size="20" fill="#4D5353">Why did it happen?</text></g><g transform="translate(569 110)"><rect width="200" height="200" rx="22" fill="#fff" stroke="#121212" stroke-width="4"/><text x="100" y="98" font-size="28" font-weight="600" fill="#121212">Predictive</text><text x="100" y="145" font-size="19" fill="#4D5353">What might happen next?</text></g><g transform="translate(836 110)"><rect width="230" height="200" rx="22" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/><text x="115" y="98" font-size="28" font-weight="600" fill="#121212">Prescriptive</text><text x="115" y="145" font-size="23" fill="#4D5353">What should we do?</text></g></g>
</svg>
