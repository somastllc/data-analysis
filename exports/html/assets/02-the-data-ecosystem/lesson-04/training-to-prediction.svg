<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">Machine-learning training and prediction flow</title><desc id="h-desc">Past examples are used during training to create a trained model. The model is then applied to new data to make a prediction.</desc>
  <defs><pattern id="h-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern><marker id="h-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs><rect width="1120" height="430" rx="24" fill="url(#h-dots)"/>
  <path d="M210 208 H265 M430 208 H485 M675 208 H730 M900 208 H955" fill="none" stroke="#1A733A" stroke-width="5" marker-end="url(#h-arrow)"/>
  <g font-family="Geist,Arial,sans-serif" text-anchor="middle"><g transform="translate(35 130)"><rect width="175" height="155" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="87" y="70" font-size="27" font-weight="600" fill="#121212">Past</text><text x="87" y="106" font-size="27" font-weight="600" fill="#121212">examples</text></g><g transform="translate(265 130)"><rect width="165" height="155" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><path d="M51 88 C76 43 91 121 116 55" fill="none" stroke="#1A733A" stroke-width="6"/><text x="82" y="130" font-size="26" font-weight="600" fill="#121212">Training</text></g><g transform="translate(485 112)"><rect width="190" height="191" rx="28" fill="#EDFBF2" stroke="#1A733A" stroke-width="5"/><circle cx="95" cy="65" r="33" fill="#fff" stroke="#121212" stroke-width="4"/><path d="M80 65 H110 M95 50 V80" stroke="#1A733A" stroke-width="5" stroke-linecap="round"/><text x="95" y="139" font-size="28" font-weight="600" fill="#121212">Trained model</text></g><g transform="translate(730 130)"><rect width="170" height="155" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="85" y="70" font-size="27" font-weight="600" fill="#121212">New</text><text x="85" y="106" font-size="27" font-weight="600" fill="#121212">data</text></g><g transform="translate(955 130)"><rect width="130" height="155" rx="20" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/><text x="65" y="76" font-size="24" font-weight="600" fill="#121212">Prediction</text><path d="M34 112 H96" stroke="#1A733A" stroke-width="7" stroke-linecap="round"/></g></g>
