<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 410" role="img" aria-labelledby="j-title j-desc">
  <title id="j-title">Six-stage data pipeline</title><desc id="j-desc">Data moves from collection through storage, cleaning, transformation, analysis, and sharing.</desc>
  <defs><pattern id="j-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern><marker id="j-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs><rect width="1140" height="410" rx="24" fill="url(#j-dots)"/><path d="M190 203 H220 M370 203 H400 M550 203 H580 M730 203 H760 M910 203 H940" fill="none" stroke="#1A733A" stroke-width="5" marker-end="url(#j-arrow)"/>
  <g font-family="Geist,Arial,sans-serif" text-anchor="middle"><g transform="translate(30 125)"><rect width="160" height="156" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="80" y="90" font-size="25" font-weight="600" fill="#121212">Collect</text></g><g transform="translate(210 125)"><rect width="160" height="156" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="80" y="90" font-size="25" font-weight="600" fill="#121212">Store</text></g><g transform="translate(390 125)"><rect width="160" height="156" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="80" y="90" font-size="25" font-weight="600" fill="#121212">Clean</text></g><g transform="translate(570 125)"><rect width="160" height="156" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="80" y="90" font-size="25" font-weight="600" fill="#121212">Transform</text></g><g transform="translate(750 125)"><rect width="160" height="156" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><text x="80" y="90" font-size="25" font-weight="600" fill="#121212">Analyze</text></g><g transform="translate(930 125)"><rect width="180" height="156" rx="20" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/><text x="90" y="90" font-size="25" font-weight="600" fill="#121212">Share</text></g></g>
</svg>
