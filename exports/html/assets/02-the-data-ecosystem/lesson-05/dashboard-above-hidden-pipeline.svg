<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="k-title k-desc">
  <title id="k-title">A visible dashboard supported by a hidden pipeline</title><desc id="k-desc">A manager sees one sales number on a dashboard, while six pipeline stages happen underneath it.</desc>
  <defs><pattern id="k-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern><marker id="k-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs><rect width="980" height="540" rx="24" fill="url(#k-dots)"/>
  <g transform="translate(312 35)" font-family="Geist,Arial,sans-serif"><rect width="356" height="175" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><rect x="24" y="24" width="308" height="106" rx="12" fill="#EDFBF2"/><text x="178" y="91" text-anchor="middle" font-size="34" font-weight="600" fill="#1A733A">Sales number</text><path d="M140 151 H216" stroke="#121212" stroke-width="5" stroke-linecap="round"/></g>
  <path d="M490 215 V267" stroke="#1A733A" stroke-width="5" marker-end="url(#k-arrow)"/><path d="M68 248 C277 276 705 218 912 248 L866 500 H112Z" fill="#fff" stroke="#121212" stroke-width="4"/>
  <g transform="translate(135 337)" font-family="Geist,Arial,sans-serif" text-anchor="middle"><g><circle cx="45" cy="45" r="43" fill="#EDFBF2" stroke="#121212" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Collect</text></g><g transform="translate(132)"><circle cx="45" cy="45" r="43" fill="#EDFBF2" stroke="#121212" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Store</text></g><g transform="translate(264)"><circle cx="45" cy="45" r="43" fill="#EDFBF2" stroke="#121212" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Clean</text></g><g transform="translate(396)"><circle cx="45" cy="45" r="43" fill="#EDFBF2" stroke="#121212" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Transform</text></g><g transform="translate(528)"><circle cx="45" cy="45" r="43" fill="#EDFBF2" stroke="#121212" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Analyze</text></g><g transform="translate(660)"><circle cx="45" cy="45" r="43" fill="#D9F5E3" stroke="#1A733A" stroke-width="3"/><text x="45" y="52" font-size="18" font-weight="600">Share</text></g></g>
