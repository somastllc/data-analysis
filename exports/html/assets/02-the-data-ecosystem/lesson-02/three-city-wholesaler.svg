<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="e-title e-desc">
  <title id="e-title">Three-city wholesaler analysis</title><desc id="e-desc">Orders and returns from Springfield, Riverton, and Lakeview flow into an analysis and then a weekly dashboard. Lakeview has unusually high returns.</desc>
  <defs><pattern id="e-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern><marker id="e-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="2"/></marker></defs><rect width="1080" height="430" rx="24" fill="url(#e-dots)"/>
  <g font-family="Geist,Arial,sans-serif"><g transform="translate(42 40)"><rect width="240" height="92" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="120" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#121212">Springfield</text></g><g transform="translate(42 169)"><rect width="240" height="92" rx="15" fill="#fff" stroke="#121212" stroke-width="3"/><text x="120" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#121212">Riverton</text></g><g transform="translate(42 298)"><rect width="240" height="92" rx="15" fill="#EDFBF2" stroke="#1A733A" stroke-width="4"/><text x="24" y="40" font-size="26" font-weight="600" fill="#121212">Lakeview</text><text x="24" y="70" font-size="19" font-weight="500" fill="#1A733A">far more unsold stock</text></g></g>
  <g fill="none" stroke="#1A733A" stroke-width="4" marker-end="url(#e-arrow)"><path d="M282 86 C345 86 340 177 402 194"/><path d="M282 215 H402"/><path d="M282 344 C345 344 340 253 402 236"/></g><g transform="translate(408 136)" font-family="Geist,Arial,sans-serif"><circle cx="105" cy="79" r="78" fill="#fff" stroke="#121212" stroke-width="4"/><circle cx="88" cy="62" r="31" fill="none" stroke="#1A733A" stroke-width="6"/><path d="M111 86 L145 120" stroke="#1A733A" stroke-width="8" stroke-linecap="round"/><text x="105" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#121212">six months of</text><text x="105" y="208" text-anchor="middle" font-size="20" font-weight="600" fill="#121212">orders and returns</text></g><path d="M600 215 H700" fill="none" stroke="#1A733A" stroke-width="5" marker-end="url(#e-arrow)"/><g transform="translate(722 89)" font-family="Geist,Arial,sans-serif"><rect width="314" height="252" rx="20" fill="#fff" stroke="#121212" stroke-width="4"/><rect x="25" y="28" width="264" height="150" rx="12" fill="#EDFBF2" stroke="#AEEBC5" stroke-width="2"/><path d="M47 144 L94 115 L140 129 L196 71 L263 87" fill="none" stroke="#1A733A" stroke-width="6"/><text x="157" y="220" text-anchor="middle" font-size="25" font-weight="600" fill="#121212">report and a dashboard</text></g>
</svg>
