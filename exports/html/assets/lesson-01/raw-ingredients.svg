<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="title desc">
  <title id="title">Raw ingredients as a metaphor for data</title>
  <desc id="desc">Hand-drawn tomato, onion, rice bag, and oil sit separately on a cutting board.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#AEEBC5" opacity=".55"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="420" height="250" fill="url(#dots)"/>
  <g stroke="#121212" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 174 Q42 168 51 161 L351 158 Q360 162 355 177 L347 215 Q343 222 333 220 L55 222 Q45 218 47 207Z" fill="#FFFDF8"/>
    <path d="M50 178 Q164 181 355 174" fill="none" opacity=".35"/>
    <path d="M85 157 C56 133 61 92 92 81 C126 70 153 98 145 128 C138 155 109 169 85 157Z" fill="#D5F5E1"/>
    <path d="M92 80 Q96 64 111 61 M95 81 Q79 68 72 77 M95 80 Q113 69 123 76" fill="none" stroke="#1A733A"/>
    <path d="M178 158 C149 145 150 107 176 91 C205 103 211 142 190 159Z" fill="#fff3bf"/>
    <path d="M178 91 Q176 73 189 66 M176 91 Q165 75 157 78" fill="none" stroke="#1A733A"/>
    <path d="M232 158 Q228 112 244 84 L286 84 Q301 112 297 159Z" fill="#FFFFFF"/>
    <path d="M241 103 Q265 109 290 102 M238 137 Q264 130 294 138" fill="none" stroke="#6E7676" stroke-width="2"/>
    <path d="M327 158 L322 95 Q325 79 340 79 Q354 81 356 96 L352 158Z" fill="#EDFBF2"/>
    <path d="M326 103 H353 M334 79 V66 H347 V80" fill="none"/>
  </g>
  <g fill="#121212" font-family="'Patrick Hand','Comic Sans MS',cursive">
    <text x="20" y="32" font-size="25">separate raw pieces</text>
    <text x="268" y="44" font-size="20" fill="#1A733A" transform="rotate(4 268 44)">not a meal yet!</text>
  </g>
  <path d="M300 50 Q283 61 273 84" fill="none" stroke="#1A733A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
