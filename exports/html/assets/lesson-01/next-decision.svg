<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="title desc">
  <title id="title">A useful decision as a metaphor for insight</title>
  <desc id="desc">A hand-drawn recipe note records what people liked and points toward the next choice.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#AEEBC5" opacity=".55"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1A733A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="420" height="250" fill="url(#dots)"/>
  <g stroke="#121212" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 43 Q161 39 273 45 L268 215 Q163 222 61 212Z" fill="#FFFDF8"/>
    <path d="M66 80 Q155 76 271 82" fill="none"/>
    <path d="M91 113 L102 124 L121 101 M91 153 L102 164 L121 141" fill="none" stroke="#1A733A" stroke-width="4"/>
    <path d="M137 111 Q190 105 239 111 M137 126 Q184 132 220 125 M137 151 Q196 146 241 152 M137 167 Q180 173 226 167" fill="none" stroke="#6E7676" stroke-width="2.4"/>
    <path d="M310 76 Q310 43 340 43 Q370 43 370 76 Q369 96 355 105 L354 121 L326 121 L325 105 Q310 96 310 76Z" fill="#D5F5E1"/>
    <path d="M327 132 Q340 136 355 132" fill="none"/>
    <path d="M340 25 V8 M378 40 L391 27 M302 40 L289 27" fill="none" stroke="#3ACC69"/>
    <path d="M281 183 Q328 172 376 148" fill="none" stroke="#1A733A" marker-end="url(#arrow)"/>
  </g>
  <g fill="#121212" font-family="'Patrick Hand','Comic Sans MS',cursive">
    <text x="82" y="69" font-size="22">what people liked</text>
    <text x="220" y="214" font-size="20" fill="#1A733A" transform="rotate(-4 220 214)">choose next!</text>
  </g>
</svg>
