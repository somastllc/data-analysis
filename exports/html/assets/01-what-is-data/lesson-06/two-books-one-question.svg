<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="bd-title bd-desc">
  <title id="bd-title">A small furniture shop's sales records beside a digital wallet's records</title>
  <desc id="bd-desc">About twenty furniture-shop sales per day sit beside millions of digital-wallet payments per day.</desc>
  <defs>
    <pattern id="bd-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#D7DDDD"/></pattern>
  </defs>
  <rect width="1180" height="420" rx="24" fill="url(#bd-dots)"/>

  <g font-family="Geist,Arial,sans-serif">
    <text x="48" y="56" font-size="26" font-weight="600" fill="#121212">A small furniture shop</text>
    <text x="638" y="56" font-size="26" font-weight="600" fill="#121212">A digital wallet</text>

    <g transform="translate(48 84)">
      <rect width="300" height="230" rx="14" fill="#fff" stroke="#121212" stroke-width="4"/>
      <path d="M0 52 H300 M0 96 H300 M0 140 H300 M0 184 H300" fill="none" stroke="#DDE2E2" stroke-width="2"/>
      <rect width="300" height="52" rx="14" fill="#EDF0F0"/>
      <rect y="36" width="300" height="16" fill="#EDF0F0"/>
      <text x="22" y="34" font-size="18" font-weight="500" fill="#4D5353">SALES RECORDS</text>
      <g fill="#AEEBC5">
        <circle cx="24" cy="74" r="5"/>
        <circle cx="24" cy="118" r="5"/>
        <circle cx="24" cy="162" r="5"/>
        <circle cx="24" cy="206" r="5"/>
      </g>
      <g stroke="#8B9494" stroke-width="3" stroke-linecap="round">
        <path d="M42 74 H258 M42 118 H232 M42 162 H270 M42 206 H218"/>
      </g>
    </g>
    <text x="198" y="356" font-size="23" fill="#121212" text-anchor="middle">about 20 sales per day</text>
    <text x="198" y="390" font-size="23" fill="#121212" text-anchor="middle">a few sales per hour</text>

    <g transform="translate(638 84)">
      <g fill="#fff" stroke="#121212" stroke-width="3">
        <rect x="0" y="0" width="128" height="96" rx="11"/>
        <rect x="148" y="0" width="128" height="96" rx="11"/>
        <rect x="296" y="0" width="128" height="96" rx="11"/>
        <rect x="0" y="118" width="128" height="96" rx="11"/>
        <rect x="148" y="118" width="128" height="96" rx="11"/>
        <rect x="296" y="118" width="128" height="96" rx="11"/>
      </g>
      <g fill="#8B9494" font-size="17" text-anchor="middle">
        <text x="64" y="54">payments</text>
        <text x="212" y="54">app logs</text>
        <text x="360" y="54">messages</text>
        <text x="64" y="162"><tspan x="64">receipt</tspan><tspan x="64" dy="20">photos</tspan></text>
        <text x="212" y="172">payments</text>
        <text x="360" y="172">payments</text>
      </g>
      <rect x="-16" y="-16" width="456" height="246" rx="18" fill="none" stroke="#1A733A" stroke-width="4" stroke-dasharray="12 9"/>
    </g>
    <text x="850" y="356" font-size="23" fill="#121212" text-anchor="middle">millions of payments per day</text>
    <text x="850" y="390" font-size="23" fill="#121212" text-anchor="middle">thousands of payments per second</text>
  </g>
</svg>
