<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Three data responsibilities</title>
  <desc id="desc">Poor data can mislead, mishandled personal data can harm privacy, and biased data can create unfair outcomes.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D8DDDD"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#A33A3A"/>
    </marker>
  </defs>

  <rect width="960" height="500" rx="26" fill="#F6F8F8"/>

  <g transform="translate(26 30)">
    <rect width="286" height="414" rx="20" fill="#FFFFFF" stroke="#E8CCCC" stroke-width="3"/>
    <rect x="18" y="18" width="250" height="54" rx="12" fill="#FCEBEC"/>
    <circle cx="48" cy="45" r="15" fill="#A33A3A"/>
    <path d="M48 34 v14 M48 57 h.1" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="73" y="53" font-family="Geist, Arial, sans-serif" font-size="23" font-weight="600" fill="#121212">Poor data</text>

    <g transform="translate(39 104)">
      <rect x="0" y="0" width="91" height="104" rx="9" fill="url(#dots)" stroke="#BFC7C7" stroke-width="2"/>
      <path d="M17 25 h50 M17 45 h24 M17 65 h59 M17 85 h32" stroke="#6E7676" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 38 l15 15 M55 38 L40 53" stroke="#A33A3A" stroke-width="4" stroke-linecap="round"/>
      <path d="M105 52 C128 52 133 52 154 52" fill="none" stroke="#A33A3A" stroke-width="4" marker-end="url(#arrow-red)"/>
      <g transform="translate(169 4)">
        <path d="M0 100 L40 7 L80 100z" fill="#FCEBEC" stroke="#A33A3A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M40 35 v31 M40 79 h.1" stroke="#A33A3A" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
    <path d="M38 244 C102 256 183 253 248 241" fill="none" stroke="#A33A3A" stroke-width="3" stroke-linecap="round"/>
    <text x="64" y="300" font-family="Patrick Hand, cursive" font-size="27" fill="#A33A3A">can mislead people</text>
    <rect x="27" y="322" width="232" height="64" rx="12" fill="#F6F8F8" stroke="#DDE2E2" stroke-width="2"/>
    <text x="143" y="349" text-anchor="middle" font-family="Geist Mono, monospace" font-size="15" fill="#4D5353">QUESTION</text>
    <text x="143" y="374" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="19" font-weight="600" fill="#121212">Is the data sound?</text>
  </g>

  <g transform="translate(337 30)">
    <rect width="286" height="414" rx="20" fill="#FFFFFF" stroke="#E8CCCC" stroke-width="3"/>
    <rect x="18" y="18" width="250" height="54" rx="12" fill="#FCEBEC"/>
    <circle cx="48" cy="45" r="15" fill="#A33A3A"/>
    <path d="M48 34 v14 M48 57 h.1" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="73" y="53" font-family="Geist, Arial, sans-serif" font-size="23" font-weight="600" fill="#121212">Personal data</text>

    <g transform="translate(67 97)">
      <rect x="2" y="54" width="148" height="114" rx="16" fill="#FCEBEC" stroke="#A33A3A" stroke-width="4"/>
      <path d="M42 55 V34 C42 2 91 -4 108 19" fill="none" stroke="#121212" stroke-width="9" stroke-linecap="round"/>
      <path d="M108 19 L128 9" stroke="#A33A3A" stroke-width="5" stroke-linecap="round"/>
      <circle cx="76" cy="103" r="13" fill="#A33A3A"/>
      <path d="M76 114 v27" stroke="#A33A3A" stroke-width="9" stroke-linecap="round"/>
      <path d="M161 46 C183 55 194 70 193 89" fill="none" stroke="#A33A3A" stroke-width="4" marker-end="url(#arrow-red)"/>
      <path d="M176 110 C188 101 201 107 203 119 C206 132 191 141 179 154 C167 141 151 132 154 119 C156 107 169 101 176 110z" fill="#FCEBEC" stroke="#A33A3A" stroke-width="3"/>
    </g>
    <path d="M40 276 C104 288 181 284 246 273" fill="none" stroke="#A33A3A" stroke-width="3" stroke-linecap="round"/>
    <text x="67" y="300" font-family="Patrick Hand, cursive" font-size="27" fill="#A33A3A">can harm privacy</text>
    <rect x="27" y="322" width="232" height="64" rx="12" fill="#F6F8F8" stroke="#DDE2E2" stroke-width="2"/>
    <text x="143" y="349" text-anchor="middle" font-family="Geist Mono, monospace" font-size="15" fill="#4D5353">PROTECT</text>
    <text x="143" y="374" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="19" font-weight="600" fill="#121212">Who could be exposed?</text>
  </g>

  <g transform="translate(648 30)">
    <rect width="286" height="414" rx="20" fill="#FFFFFF" stroke="#E8CCCC" stroke-width="3"/>
    <rect x="18" y="18" width="250" height="54" rx="12" fill="#FCEBEC"/>
    <circle cx="48" cy="45" r="15" fill="#A33A3A"/>
    <path d="M48 34 v14 M48 57 h.1" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="73" y="53" font-family="Geist, Arial, sans-serif" font-size="23" font-weight="600" fill="#121212">Biased data</text>

    <g transform="translate(39 111)" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M106 5 v161 M64 166 h84 M77 5 h58"/>
      <path d="M106 28 L30 69 M106 28 L182 52"/>
      <path d="M30 69 L5 115 h50z" fill="#FCEBEC" stroke="#A33A3A"/>
      <path d="M182 52 l-25 46 h50z" fill="#EDFBF2" stroke="#1A733A"/>
      <circle cx="106" cy="28" r="9" fill="#121212"/>
    </g>
    <path d="M38 276 C102 287 184 283 248 271" fill="none" stroke="#A33A3A" stroke-width="3" stroke-linecap="round"/>
    <text x="31" y="300" font-family="Patrick Hand, cursive" font-size="24" fill="#A33A3A">can create unfair outcomes</text>
    <rect x="27" y="322" width="232" height="64" rx="12" fill="#F6F8F8" stroke="#DDE2E2" stroke-width="2"/>
    <text x="143" y="349" text-anchor="middle" font-family="Geist Mono, monospace" font-size="15" fill="#4D5353">CONSIDER</text>
    <text x="143" y="374" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="19" font-weight="600" fill="#121212">Who could be harmed?</text>
  </g>

  <path d="M73 467 C274 480 682 477 887 465" fill="none" stroke="#1A733A" stroke-width="4" stroke-linecap="round"/>
  <text x="480" y="489" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="27" fill="#1A733A">responsibility starts before analysis</text>
</svg>
