<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 470" role="img" aria-labelledby="question-title question-desc">
  <title id="question-title">A general sales request becomes a clear analytical question</title>
  <desc id="question-desc">Can you look into the sales data becomes: How much did rice sales drop in August compared to July, and which branch had the biggest drop?</desc>
  <defs>
    <pattern id="question-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#D7DDDD"/>
    </pattern>
    <marker id="question-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1A733A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1420" height="470" rx="28" fill="url(#question-dots)"/>

  <text x="48" y="57" font-family="Geist, Arial, sans-serif" font-size="26" font-weight="500" fill="#4D5353">The question</text>

  <g transform="translate(48 91)">
    <rect width="450" height="288" rx="28" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
    <path d="M110 288 L83 330 L166 288" fill="#FFFFFF" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
    <text x="225" y="123" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="39" font-weight="600" fill="#121212">
      <tspan x="225" dy="0">“Can you look into</tspan>
      <tspan x="225" dy="56">the sales data?”</tspan>
    </text>
  </g>

  <text x="619" y="190" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="26" font-weight="500" fill="#4D5353">can become:</text>
  <path d="M548 235 H690" fill="none" stroke="#1A733A" stroke-width="7" stroke-linecap="round" marker-end="url(#question-arrow)"/>

  <g transform="translate(736 59)">
    <rect width="636" height="352" rx="28" fill="#EDFBF2" stroke="#1A733A" stroke-width="5"/>
    <circle cx="318" cy="58" r="25" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
    <path d="M337 77 L360 100" fill="none" stroke="#121212" stroke-width="7" stroke-linecap="round"/>
    <text x="318" y="145" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="33" font-weight="600" fill="#121212">
      <tspan x="318" dy="0">“How much did rice sales</tspan>
      <tspan x="318" dy="46">drop in August compared to July,</tspan>
      <tspan x="318" dy="46">and which branch had the</tspan>
      <tspan x="318" dy="46">biggest drop?”</tspan>
    </text>
  </g>
</svg>
