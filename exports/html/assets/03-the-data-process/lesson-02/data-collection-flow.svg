<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 330" role="img" aria-labelledby="collection-title collection-desc">
  <title id="collection-title">Data collection flow</title>
  <desc id="collection-desc">Question, needed data, what the data should cover, collect, and check.</desc>
  <defs>
    <pattern id="collection-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#D7DDDD"/>
    </pattern>
    <marker id="collection-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1A733A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1500" height="330" rx="28" fill="url(#collection-dots)"/>

  <g fill="none" stroke="#1A733A" stroke-width="6" stroke-linecap="round" marker-end="url(#collection-arrow)">
    <path d="M250 165 H310"/>
    <path d="M560 165 H620"/>
    <path d="M970 165 H1030"/>
    <path d="M1220 165 H1280"/>
  </g>

  <g font-family="Geist, Arial, sans-serif" text-anchor="middle" fill="#121212">
    <g transform="translate(30 95)">
      <rect width="220" height="140" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
      <text x="110" y="84" font-size="30" font-weight="600">Question</text>
    </g>

    <g transform="translate(320 95)">
      <rect width="240" height="140" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
      <text x="120" y="84" font-size="30" font-weight="600">needed data</text>
    </g>

    <g transform="translate(630 73)">
      <rect width="340" height="184" rx="26" fill="#EDFBF2" stroke="#1A733A" stroke-width="5"/>
      <text x="170" y="83" font-size="29" font-weight="600">
        <tspan x="170" dy="0">what the data</tspan>
        <tspan x="170" dy="43">should cover</tspan>
      </text>
    </g>

    <g transform="translate(1040 95)">
      <rect width="180" height="140" rx="22" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
      <text x="90" y="84" font-size="30" font-weight="600">collect</text>
    </g>

    <g transform="translate(1290 95)">
      <rect width="180" height="140" rx="22" fill="#EDFBF2" stroke="#1A733A" stroke-width="5"/>
      <path d="M60 70 L80 90 L121 48" fill="none" stroke="#1A733A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="119" font-size="27" font-weight="600">check</text>
    </g>
  </g>
</svg>
