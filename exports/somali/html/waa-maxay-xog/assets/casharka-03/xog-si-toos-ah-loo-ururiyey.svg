  <title id="title">Xog si toos ah loo ururiyey oo si toos ah loo duubay</title>
  <desc id="desc">Sawir gacan lagu sameeyay oo dukaan iibkiisa maalinlaha ah si toos ah ugu duubaya buugga milkiilaha ujeeddo gaar ah.</desc>
