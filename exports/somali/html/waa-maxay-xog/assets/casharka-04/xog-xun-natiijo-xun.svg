  <title id="title">Xog xun oo la geliyo waxay keentaa natiijo xun</title>
  <desc id="desc">Kaararka xog xun oo la calaamadiyey maqan, soo noqnoqday, iyo khaldan ayaa gasha mashiin falanqayn oo si sax ah u shaqeeya, waxayna soo saartaa natiijo qurux badan laakiin khaldan.</desc>
