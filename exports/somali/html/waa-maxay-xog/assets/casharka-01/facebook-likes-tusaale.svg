<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Tirada likes-ka oo u beddelaysa faham muhiim ah</title>
  <desc id="desc">Saddex sawir gudbin ah: tirooyinka 20, 45, iyo 90 likes, ka dibna muuqaalka ugu badan ee likes-ka helay, ka dibna go'aanka in muuqaal la mid ah dib loo diyaariyo.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="1500" height="470" rx="24" fill="#F6F8F8"/>

  <g transform="translate(20 24)">
    <rect width="410" height="410" rx="22" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <rect x="22" y="20" width="200" height="46" rx="12" fill="#EDF0F0"/>
    <text x="122" y="51" text-anchor="middle" font-family="Geist Mono, monospace" font-size="17" letter-spacing="1.2" fill="#4D5353">TIRADA LIKES-KA</text>

    <g transform="translate(60 100)" stroke="#121212" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="180" width="70" height="60" rx="8" fill="#D9F5E3"/>
      <rect x="105" y="120" width="70" height="120" rx="8" fill="#D9F5E3"/>
      <rect x="210" y="30" width="70" height="210" rx="8" fill="#3ACC69"/>
    </g>
    <g fill="#121212" font-family="Geist Mono, monospace" font-size="26" font-weight="600" text-anchor="middle">
      <text x="95" y="266">20</text>
      <text x="200" y="266">45</text>
      <text x="305" y="266">90</text>
    </g>
    <text x="205" y="380" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="29" fill="#1A733A">saddex xaqiiqo oo kali ah</text>
  </g>

  <path d="M451 230 C479 219 501 218 529 228" fill="none" stroke="#1A733A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow2)"/>

  <g transform="translate(545 24)">
    <rect width="410" height="410" rx="22" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="3"/>
    <rect x="22" y="20" width="230" height="46" rx="12" fill="#EDFBF2"/>
    <text x="137" y="51" text-anchor="middle" font-family="Geist Mono, monospace" font-size="17" letter-spacing="1.2" fill="#1A733A">MUUQAALKA UGU BADAN</text>

    <g transform="translate(55 95)" stroke="#121212" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="300" height="200" rx="16" fill="#D9F5E3"/>
      <path d="M40 150 C70 100 110 80 150 100 C190 120 220 90 260 60" fill="none" stroke="#1A733A" stroke-width="4"/>
      <circle cx="150" cy="100" r="10" fill="#3ACC69"/>
      <path d="M25 178 h250" stroke="#6E7676" stroke-width="3"/>
      <path d="M40 200 L40 220 M110 200 L110 220 M180 200 L180 220 M250 200 L250 220" stroke="none"/>
    </g>
    <g transform="translate(55 315)" font-family="Geist Mono, monospace" font-size="24" fill="#1A733A" font-weight="600">
      <text x="0" y="0">90 likes = ugu badan</text>
    </g>
    <text x="205" y="380" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="29" fill="#1A733A">jawaabta suʼaasha</text>
  </g>

  <path d="M976 230 C1004 219 1026 218 1054 228" fill="none" stroke="#1A733A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow2)"/>

  <g transform="translate(1070 24)">
    <rect width="410" height="410" rx="22" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="3"/>
    <rect x="22" y="20" width="200" height="46" rx="12" fill="#EDFBF2"/>
    <text x="122" y="51" text-anchor="middle" font-family="Geist Mono, monospace" font-size="17" letter-spacing="1.2" fill="#1A733A">MUUQAAL DAMBE</text>

    <g transform="translate(120 95)" stroke="#121212" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="140" height="230" rx="20" fill="#F6F8F8"/>
      <rect x="14" y="20" width="112" height="170" rx="6" fill="#FFFFFF"/>
      <circle cx="70" cy="205" r="8" fill="none"/>
      <path d="M45 80 a25 25 0 1 1 50 0 c0 16 -12 20 -12 34 h-26 c0 -14 -12 -18 -12 -34z" fill="#FFF0B8" stroke="#121212"/>
      <path d="M58 122 h24" stroke="#121212"/>
      <path d="M20 45 l10 10 M120 45 l-10 10" stroke="#1A733A"/>
    </g>
    <text x="205" y="380" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="29" fill="#1A733A">mar kale diyaari muuqaal</text>
  </g>
</svg>
