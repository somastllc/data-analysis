<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">Data oo isu beddelaysa information iyo insight</title>
  <desc id="desc">Iibka afar maalmood waa 10, 15, 12, iyo 30 xabbo. Maalinta afraad ayaa ugu badan, waxaana maalintaas dhacay xayaysiis laga yaabo inuu iibka kordhiyey.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#D7DDDD"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="1080" height="540" rx="26" fill="#F6F8F8"/>

  <g transform="translate(24 28)">
    <rect width="322" height="472" rx="20" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <rect x="20" y="18" width="98" height="46" rx="12" fill="#EDF0F0"/>
    <text x="69" y="49" text-anchor="middle" font-family="Geist Mono, monospace" font-size="18" letter-spacing="1.2" fill="#4D5353">DATA</text>
    <text x="24" y="101" font-family="Geist, Arial, sans-serif" font-size="25" font-weight="600" fill="#121212">Iibka 4 maalmood</text>

    <g transform="translate(30 142)">
      <path d="M0 243 H260" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 177 H260 M0 111 H260 M0 45 H260" stroke="#DDE2E2" stroke-width="2" stroke-dasharray="6 8"/>
      <rect x="16" y="177" width="42" height="66" rx="5" fill="#EDF0F0" stroke="#121212" stroke-width="3"/>
      <rect x="78" y="144" width="42" height="99" rx="5" fill="#EDF0F0" stroke="#121212" stroke-width="3"/>
      <rect x="140" y="164" width="42" height="79" rx="5" fill="#EDF0F0" stroke="#121212" stroke-width="3"/>
      <rect x="202" y="45" width="42" height="198" rx="5" fill="#D9F5E3" stroke="#1A733A" stroke-width="4"/>
      <g font-family="Geist Mono, monospace" font-size="19" text-anchor="middle" fill="#121212">
        <text x="37" y="167">10</text><text x="99" y="134">15</text><text x="161" y="154">12</text><text x="223" y="35" font-weight="600" fill="#1A733A">30</text>
      </g>
      <g font-family="Geist, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#6E7676">
        <text x="37" y="274">M1</text><text x="99" y="274">M2</text><text x="161" y="274">M3</text><text x="223" y="274">M4</text>
      </g>
    </g>
    <text x="161" y="443" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="28" fill="#6E7676">tirooyinka la diiwaangeliyey</text>
  </g>

  <path d="M363 266 C387 254 405 254 429 266" fill="none" stroke="#1A733A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(445 28)">
    <rect width="270" height="472" rx="20" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="3"/>
    <rect x="20" y="18" width="164" height="46" rx="12" fill="#EDFBF2"/>
    <text x="102" y="49" text-anchor="middle" font-family="Geist Mono, monospace" font-size="18" letter-spacing="1.1" fill="#1A733A">INFORMATION</text>

    <g transform="translate(32 107)">
      <rect width="206" height="218" rx="16" fill="url(#dots)" stroke="#DDE2E2" stroke-width="2"/>
      <path d="M36 174 H170" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
      <rect x="82" y="37" width="42" height="137" rx="6" fill="#D9F5E3" stroke="#1A733A" stroke-width="4"/>
      <text x="103" y="27" text-anchor="middle" font-family="Geist Mono, monospace" font-size="24" font-weight="600" fill="#1A733A">30</text>
      <path d="M145 65 C169 69 180 82 181 103" fill="none" stroke="#1A733A" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="180" cy="116" r="22" fill="#EDFBF2" stroke="#1A733A" stroke-width="3"/>
      <path d="M169 116 l8 8 15 -19" fill="none" stroke="#1A733A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="135" y="370" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="25" font-weight="600" fill="#121212">Maalintii 4aad</text>
    <text x="135" y="403" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="25" font-weight="600" fill="#121212">ayaa ugu badnayd</text>
    <path d="M48 423 C100 436 171 436 222 422" fill="none" stroke="#1A733A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M732 266 C756 254 774 254 798 266" fill="none" stroke="#1A733A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(814 28)">
    <rect width="242" height="472" rx="20" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="3"/>
    <rect x="20" y="18" width="104" height="46" rx="12" fill="#EDFBF2"/>
    <text x="72" y="49" text-anchor="middle" font-family="Geist Mono, monospace" font-size="18" letter-spacing="1.2" fill="#1A733A">INSIGHT</text>

    <g transform="translate(25 99)" stroke="#121212" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 65 L99 28 L99 147 L11 110z" fill="#D9F5E3"/>
      <path d="M99 50 C132 58 151 76 155 94 C151 112 132 130 99 137" fill="#FFFFFF"/>
      <path d="M25 115 L41 179 L75 171 L61 129" fill="#F6F8F8"/>
      <path d="M172 43 v-27 M177 160 l12 25 M181 98 h28" stroke="#1A733A"/>
    </g>
    <text x="121" y="334" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="25" font-weight="600" fill="#121212">Xayaysiis dhacay</text>
    <rect x="31" y="360" width="180" height="62" rx="13" fill="#EDFBF2" stroke="#AEEBC5" stroke-width="2"/>
    <text x="121" y="398" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="29" fill="#1A733A">Iibku kordhay?</text>
    <text x="121" y="454" text-anchor="middle" font-family="Geist Mono, monospace" font-size="15" fill="#6E7676">WAXAY U MUUQATAA</text>
  </g>
</svg>
