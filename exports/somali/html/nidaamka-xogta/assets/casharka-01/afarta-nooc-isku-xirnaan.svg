<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Afarta nooc oo isku xirnaan</title>
  <desc id="desc">Wixii dhacay, sababta, waxa dhici kara, iyo tallaabada la qaadayo way isku xirmaan, mana aha afar tallaabo oo mar kasta khasab ah.</desc>
  <defs>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="960" height="500" rx="26" fill="#F6F8F8"/>

  <g fill="none" stroke="#1A733A" stroke-width="3.5">
    <path d="M480 133 A160 160 0 0 1 632 236" marker-end="url(#arrow-loop)"/>
    <path d="M632 297 A160 160 0 0 1 528 434" marker-end="url(#arrow-loop)"/>
    <path d="M432 434 A160 160 0 0 1 328 297" marker-end="url(#arrow-loop)"/>
    <path d="M328 236 A160 160 0 0 1 480 133" marker-end="url(#arrow-loop)"/>
  </g>
  <text x="480" y="290" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="24" fill="#1A733A">way isku xirmaan</text>

  <g transform="translate(370 40)">
    <rect width="220" height="94" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-family="Geist Mono, monospace" font-size="16" letter-spacing=".04em" fill="#4D5353">01</text>
    <text x="110" y="68" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="600" fill="#121212">Wixii dhacay</text>
  </g>

  <g transform="translate(650 189)">
    <rect width="220" height="94" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-family="Geist Mono, monospace" font-size="16" letter-spacing=".04em" fill="#4D5353">02</text>
    <text x="110" y="68" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="600" fill="#121212">Sababta</text>
  </g>

  <g transform="translate(480 386)">
    <rect width="220" height="94" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-family="Geist Mono, monospace" font-size="16" letter-spacing=".04em" fill="#4D5353">03</text>
    <text x="110" y="68" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="23" font-weight="600" fill="#121212">Waxa dhici kara</text>
  </g>

  <g transform="translate(90 189)">
    <rect width="220" height="94" rx="16" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-family="Geist Mono, monospace" font-size="16" letter-spacing=".04em" fill="#1A733A">04</text>
    <text x="110" y="68" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Tallaabada la qaadayo</text>
  </g>
</svg>
