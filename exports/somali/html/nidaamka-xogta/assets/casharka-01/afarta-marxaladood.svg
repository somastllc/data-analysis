<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Afarta marxaladood ee analytics-ka</title>
  <desc id="desc">Falanqaynta wixii dhacay ayaa horseeda falanqaynta sababta, taasoo horseeda falanqaynta saadaasha, oo dhammaadka ku dhammaystirta falanqaynta talo-bixinta.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="1600" height="400" rx="26" fill="#F6F8F8"/>

  <g transform="translate(30 40)">
    <rect width="330" height="300" rx="20" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <rect x="24" y="24" width="282" height="60" rx="13" fill="#EDF0F0"/>
    <text x="45" y="63" font-family="Geist Mono, monospace" font-size="20" fill="#4D5353">01</text>
    <g transform="translate(220 34)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 34 h12 M14 34 h12 M28 34 h20 M0 20 h20 M0 6 h32"/>
    </g>
    <text x="45" y="140" font-family="Geist, Arial, sans-serif" font-size="30" font-weight="600" fill="#121212">Falanqaynta</text>
    <text x="45" y="176" font-family="Geist, Arial, sans-serif" font-size="30" font-weight="600" fill="#121212">wixii dhacay</text>
    <rect x="45" y="216" width="240" height="56" rx="11" fill="#F6F8F8" stroke="#DDE2E2" stroke-width="2"/>
    <text x="165" y="250" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="24" fill="#4D5353">Maxaa dhacay?</text>
  </g>

  <path d="M368 190 C388 190 392 190 412 190" fill="none" stroke="#1A733A" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g transform="translate(423 40)">
    <rect width="330" height="300" rx="20" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
