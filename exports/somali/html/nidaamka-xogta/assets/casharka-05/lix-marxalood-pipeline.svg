    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#6E7676">(Analyze)</text>
  </g>
  <path d="M1305 145 C1313 145 1317 145 1325 145" fill="none" stroke="#1A733A" stroke-width="3" marker-end="url(#arrow-pl-green)"/>

  <g transform="translate(1325 80)">
    <rect width="245" height="130" rx="16" fill="#EDFBF2" stroke="#AEEBC5" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#1A733A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="16" r="7"/><circle cx="28" cy="6" r="7"/><circle cx="28" cy="26" r="7"/>
