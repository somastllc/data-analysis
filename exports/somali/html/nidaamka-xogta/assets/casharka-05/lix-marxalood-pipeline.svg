<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">Ururi, Kaydi, Nadiifi, Qaab-beddel, Falanqee, Wadaag</title>
  <desc id="desc">Data pipeline waa hab-socodka ay xogtu marto laga bilaabo isheeda ilaa isticmaalkeeda ugu dambeeya: ururinta, kaydinta, nadiifinta, qaab-beddelka, falanqaynta, iyo wadaagida.</desc>
  <defs>
    <marker id="arrow-pl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#6E7676"/>
    </marker>
    <marker id="arrow-pl-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="1600" height="300" rx="26" fill="#F6F8F8"/>

  <g transform="translate(30 80)">
    <rect width="235" height="130" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="5"/><circle cx="24" cy="8" r="5"/><circle cx="16" cy="24" r="5"/>
      <path d="M8 13 L16 20 M24 13 L16 20"/>
    </g>
    <text x="20" y="85" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Ururi</text>
    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#6E7676">(Collect)</text>
  </g>
  <path d="M265 145 C273 145 277 145 285 145" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-pl)"/>

  <g transform="translate(285 80)">
    <rect width="235" height="130" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="16" cy="8" rx="16" ry="6"/>
      <path d="M0 8 v16 a16 6 0 0 0 32 0 V8"/>
      <path d="M0 16 a16 6 0 0 0 32 0"/>
    </g>
    <text x="20" y="85" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Kaydi</text>
    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#6E7676">(Store)</text>
  </g>
  <path d="M520 145 C528 145 532 145 540 145" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-pl)"/>

  <g transform="translate(540 80)">
    <rect width="235" height="130" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 26 L14 10 L24 18 L38 -4" transform="translate(0 6)"/>
      <path d="M2 26 l4 8 8 -4z" transform="translate(0 6)" fill="#4D5353" stroke="none"/>
    </g>
    <text x="20" y="85" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Nadiifi</text>
    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#6E7676">(Clean)</text>
  </g>
  <path d="M775 145 C783 145 787 145 795 145" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-pl)"/>

  <g transform="translate(795 80)">
    <rect width="255" height="130" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="8" width="16" height="16" rx="3"/>
      <path d="M20 16 h12 M28 10 v12"/>
    </g>
    <text x="20" y="85" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Qaab-beddel</text>
    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#6E7676">(Transform)</text>
  </g>
  <path d="M1050 145 C1058 145 1062 145 1070 145" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-pl)"/>

  <g transform="translate(1070 80)">
    <rect width="235" height="130" rx="16" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="3"/>
    <g transform="translate(20 18)" stroke="#4D5353" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
