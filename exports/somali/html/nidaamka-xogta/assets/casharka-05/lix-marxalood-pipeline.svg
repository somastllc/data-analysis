    <text x="20" y="85" font-family="Geist, Arial, sans-serif" font-size="21" font-weight="600" fill="#121212">Wadaag</text>
    <text x="20" y="108" font-family="Geist, Arial, sans-serif" font-size="16" fill="#1A733A">(Share)</text>
  </g>
</svg>
