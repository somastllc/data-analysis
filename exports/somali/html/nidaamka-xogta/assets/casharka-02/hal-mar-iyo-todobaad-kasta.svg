  <title id="title">Suʼaal hal mar iyo suʼaal todobaad kasta</title>
  <desc id="desc">Falanqaynta xogtu badanaa waxay ka jawaabtaa suʼaal gaar ah oo hal mar la baaro, halka BI uu diyaariyo hab jawaabta suʼaashaas todobaad kasta loo cusboonaysiiyo.</desc>
