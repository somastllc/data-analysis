<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Xogta la geliyo, model, iyo saadaal muujinaya halista bixitaanka</title>
  <desc id="desc">Inta jeer ee lacagta la shubto, xirmooyinka la doortay, iyo taariikhda adeegga waxay noqdaan xogta la geliyo. Model-ku wuxuu bartaa xiriirka ka dhexeeya xogta la geliyey iyo natiijadaas, kadibna macaamiisha hadda jooga wuxuu siiyaa saadaal muujinaysa halista bixitaanka.</desc>
  <defs>
    <marker id="arrow-md" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#6E7676"/>
    </marker>
    <marker id="arrow-md-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#1A733A"/>
    </marker>
  </defs>

  <rect width="1000" height="340" rx="26" fill="#F6F8F8"/>

  <text x="34" y="38" font-family="Geist Mono, monospace" font-size="16" letter-spacing=".05em" fill="#6E7676">XOGTA LA GELIYO</text>

  <g transform="translate(34 56)">
    <rect width="260" height="76" rx="12" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="2.5"/>
    <text x="24" y="45" font-family="Geist, Arial, sans-serif" font-size="20" fill="#343838">Inta jeer lacagta la shubay</text>
  </g>
  <g transform="translate(34 148)">
    <rect width="260" height="76" rx="12" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="2.5"/>
    <text x="24" y="45" font-family="Geist, Arial, sans-serif" font-size="20" fill="#343838">Xirmooyinka la doortay</text>
  </g>
  <g transform="translate(34 240)">
    <rect width="260" height="76" rx="12" fill="#FFFFFF" stroke="#DDE2E2" stroke-width="2.5"/>
    <text x="24" y="45" font-family="Geist, Arial, sans-serif" font-size="20" fill="#343838">Taariikhda adeegga</text>
  </g>

  <path d="M294 94 C340 94 340 190 386 210" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-md)"/>
  <path d="M294 186 C340 186 340 210 386 218" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-md)"/>
  <path d="M294 278 C340 278 340 230 386 226" fill="none" stroke="#6E7676" stroke-width="3" marker-end="url(#arrow-md)"/>

  <g transform="translate(397 145)">
    <rect width="220" height="150" rx="18" fill="#121212"/>
    <g transform="translate(76 30)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 0 L68 19 V53 L34 72 L0 53 V19 z"/>
      <path d="M0 19 L34 38 L68 19 M34 38 V72"/>
    </g>
    <text x="110" y="128" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Model</text>
  </g>

  <path d="M617 220 C650 220 660 220 690 220" fill="none" stroke="#1A733A" stroke-width="3.5" marker-end="url(#arrow-md-green)"/>

  <g transform="translate(701 130)">
    <rect width="270" height="180" rx="18" fill="#EDFBF2" stroke="#AEEBC5" stroke-width="3"/>
    <text x="26" y="42" font-family="Geist Mono, monospace" font-size="15" letter-spacing=".04em" fill="#1A733A">SAADAAL</text>
    <text x="26" y="82" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="600" fill="#121212">Halista</text>
    <text x="26" y="112" font-family="Geist, Arial, sans-serif" font-size="24" font-weight="600" fill="#121212">Bixitaanka</text>
    <rect x="26" y="132" width="218" height="26" rx="7" fill="#FFFFFF" stroke="#AEEBC5" stroke-width="2"/>
    <rect x="26" y="132" width="164" height="26" rx="7" fill="#1A733A"/>
  </g>
</svg>
